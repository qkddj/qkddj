name: Refresh profile activity
on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update statistics
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          HAS_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN != '' }}
        run: |
          if [ "$HAS_STATS_TOKEN" = "true" ]; then
            node scripts/update.mjs
          else
            node scripts/update.mjs --public-only
          fi
      - name: Commit generated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile activity'
            git push
          fi
